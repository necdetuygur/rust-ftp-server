```yaml
name: Build release binaries

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip

          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz

          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz

          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare dist (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null

          Copy-Item "target/${{ matrix.target }}/release/rust-ftp-server.exe" dist/
          Copy-Item config.json dist/

          Compress-Archive `
            -Path dist/* `
            -DestinationPath "rust-ftp-server-${{ matrix.target }}.zip"

      - name: Prepare dist (Linux/macOS)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          mkdir -p dist

          cp "target/${{ matrix.target }}/release/rust-ftp-server" dist/
          cp config.json dist/

          tar -czf "rust-ftp-server-${{ matrix.target }}.tar.gz" -C dist .

      # Her çalıştırmada Actions Artifacts bölümüne yükle
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: rust-ftp-server-${{ matrix.target }}
          path: rust-ftp-server-${{ matrix.target }}.${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 30

      # Sadece version tag ile çalıştırıldığında GitHub Release oluştur
      - name: Upload GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: rust-ftp-server-${{ matrix.target }}.${{ matrix.archive }}
          fail_on_unmatched_files: true
          generate_release_notes: true
