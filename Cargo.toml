[package]
name = "rust-ftp-server"
version = "0.1.0"
edition = "2024"
description = "Config-driven FTP server starter built with libunftp"
license = "MIT"

[dependencies]
anyhow = "1"
libunftp = { version = "0.24", default-features = false, features = ["aws_lc_rs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
unftp-sbe-fs = "0.4"

[profile.release]
lto = true
codegen-units = 1
strip = true
