[package]
name = "rust-ftp-server"
version = "0.2.0"
edition = "2024"
description = "Config-driven FTP server with per-user rooted directories, built with libunftp"
license = "MIT"

[dependencies]
anyhow = "1"
async-trait = "0.1"
env_logger = "0.11"
libunftp = { version = "0.25", default-features = false, features = ["aws_lc_rs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
unftp-core = "0.1"
unftp-sbe-fs = "0.4"

[profile.release]
lto = true
codegen-units = 1
strip = true
